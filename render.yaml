databases:
  - name: concesionaria-db
    databaseName: concesionaria
    user: concesionaria
    plan: free

services:
  - type: web
    name: concesionaria-api
    runtime: docker
    rootDir: concesionaria_
    dockerfilePath: Dockerfile
    healthCheckPath: /api/salud
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: concesionaria-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: concesionaria-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: concesionaria-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: concesionaria-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: concesionaria-db
          property: password
      - key: APP_JWT_SECRET
        generateValue: true

  - type: web
    name: concesionaria-web
    runtime: docker
    rootDir: concesionaria-web
    dockerfilePath: Dockerfile
    healthCheckPath: /
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: concesionaria-api
          property: host
