spring.application.name=concesionaria-api
server.port=${PORT:8081}

# Si SPRING_DATASOURCE_URL viene definida (por ejemplo apuntando a una base
# externa) se usa tal cual. Si no, se arma con DB_HOST/DB_PORT/DB_NAME, que es
# como Render entrega los datos de su Postgres administrado (ver render.yaml).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:concesionaria}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:concesionaria}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:pass123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


app.jwt.secret=${APP_JWT_SECRET:ConcesionariaSecretKeyParaJWT2026MuySegura1234567890}
