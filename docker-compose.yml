services:
  db:
    image: postgres:16-alpine
    container_name: concesionaria-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: concesionaria
      POSTGRES_USER: concesionaria
      POSTGRES_PASSWORD: pass123
    volumes:
      - concesionaria-db-data:/var/lib/postgresql/data
      # Se ejecuta una sola vez, la primera vez que se crea el volumen.
      - ./concesionaria_/POSTGRES_SCHEMA.sql:/docker-entrypoint-initdb.d/POSTGRES_SCHEMA.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concesionaria -d concesionaria"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./concesionaria_
      dockerfile: Dockerfile
    image: concesionaria-api:latest
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: concesionaria
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-concesionaria}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-pass123}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-ConcesionariaLocalJwtSecretKey2026Segura1234567890}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./concesionaria-web
      dockerfile: Dockerfile
    container_name: concesionaria-web
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      API_URL: http://localhost:8081
    depends_on:
      - api
    restart: unless-stopped

volumes:
  concesionaria-db-data: