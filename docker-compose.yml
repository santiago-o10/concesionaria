services:
  api:
    build:
      context: ./concesionaria_
      dockerfile: Dockerfile
    image: concesionaria-api:latest
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:oracle:thin:@host.docker.internal:1521:XE}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-concesionaria}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-pass123}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-ConcesionariaLocalJwtSecretKey2026Segura1234567890}
      JAVA_TOOL_OPTIONS: -Doracle.jdbc.timezoneAsRegion=false
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./concesionaria-web
      dockerfile: Dockerfile
    container_name: concesionaria-web
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
    depends_on:
      - api
    restart: unless-stopped